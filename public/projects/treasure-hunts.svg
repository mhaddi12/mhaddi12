<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340">
  <defs>
    <linearGradient id="mapbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- Map background -->
  <rect width="620" height="340" fill="url(#mapbg)"/>

  <!-- Map grid / city blocks (stylised) -->
  <!-- Major roads (horizontal) -->
  <rect x="0" y="85" width="620" height="6" fill="#131d30" rx="0"/>
  <rect x="0" y="160" width="620" height="5" fill="#131d30"/>
  <rect x="0" y="230" width="620" height="4" fill="#131d30"/>
  <!-- Major roads (vertical) -->
  <rect x="90" y="0" width="6" height="280" fill="#131d30"/>
  <rect x="200" y="0" width="5" height="280" fill="#131d30"/>
  <rect x="330" y="0" width="6" height="280" fill="#131d30"/>
  <rect x="460" y="0" width="5" height="280" fill="#131d30"/>
  <rect x="560" y="0" width="4" height="280" fill="#131d30"/>

  <!-- City blocks (park areas in teal) -->
  <rect x="96" y="91" width="100" height="65" rx="4" fill="#0d2020"/>
  <rect x="206" y="91" width="120" height="65" rx="4" fill="#0c1e28"/>
  <rect x="336" y="91" width="120" height="65" rx="4" fill="#0d2020"/>
  <rect x="96" y="166" width="100" height="60" rx="4" fill="#0c1e28"/>
  <rect x="206" y="166" width="120" height="60" rx="4" fill="#0d2020"/>
  <rect x="336" y="166" width="120" height="60" rx="4" fill="#0c1828"/>
  <rect x="466" y="91" width="90" height="65" rx="4" fill="#0d1e2a"/>
  <rect x="466" y="166" width="90" height="60" rx="4" fill="#0d2020"/>

  <!-- Park trees dots -->
  <circle cx="120" cy="115" r="5" fill="#1a3d2a"/>
  <circle cx="140" cy="108" r="4" fill="#1a3d2a"/>
  <circle cx="160" cy="120" r="5" fill="#1a3d2a"/>
  <circle cx="130" cy="130" r="4" fill="#1a3d2a"/>
  <circle cx="155" cy="138" r="5" fill="#1a3d2a"/>
  <circle cx="350" cy="112" r="5" fill="#1a3d2a"/>
  <circle cx="370" cy="104" r="4" fill="#1a3d2a"/>
  <circle cx="390" cy="118" r="5" fill="#1a3d2a"/>
  <circle cx="360" cy="130" r="4" fill="#1a3d2a"/>

  <!-- Trail dashed line connecting pins -->
  <polyline points="155,133 240,128 360,105 475,175 390,220" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Pin 1 — FOUND (teal glow) -->
  <circle cx="155" cy="133" r="22" fill="url(#pinGlow)"/>
  <circle cx="155" cy="126" r="10" fill="#67E8F9"/>
  <circle cx="155" cy="126" r="6" fill="white"/>
  <text x="155" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#67E8F9">1 ✓</text>

  <!-- Pin 2 — FOUND -->
  <circle cx="240" cy="122" r="22" fill="url(#pinGlow)"/>
  <circle cx="240" cy="115" r="10" fill="#67E8F9"/>
  <circle cx="240" cy="115" r="6" fill="white"/>
  <text x="240" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#67E8F9">2 ✓</text>

  <!-- Pin 3 — CURRENT (violet glow + pulsing ring) -->
  <circle cx="360" cy="99" r="28" fill="url(#pinGlow2)"/>
  <circle cx="360" cy="99" r="22" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5"/>
  <circle cx="360" cy="92" r="12" fill="#A78BFA"/>
  <circle cx="360" cy="92" r="7" fill="white"/>
  <text x="360" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#A78BFA">3 ← HERE</text>

  <!-- Pin 4 — LOCKED (dim) -->
  <circle cx="475" cy="168" r="10" fill="#1e1e40"/>
  <circle cx="475" cy="168" r="6" fill="#2d2d50"/>
  <text x="475" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">4 🔒</text>

  <!-- Pin 5 — LOCKED -->
  <circle cx="390" cy="213" r="10" fill="#1e1e40"/>
  <circle cx="390" cy="213" r="6" fill="#2d2d50"/>
  <text x="390" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">5 🔒</text>

  <!-- Status bar -->
  <rect width="620" height="26" fill="rgba(10,14,26,0.85)"/>
  <text x="16" y="18" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">9:41</text>
  <rect x="574" y="7" width="28" height="12" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <rect x="602" y="10" width="3" height="6" rx="1" fill="#94A3B8"/>
  <rect x="576" y="9" width="20" height="8" rx="1.5" fill="#A78BFA"/>
  <rect x="549" y="15" width="3" height="4" fill="#94A3B8"/>
  <rect x="554" y="12" width="3" height="7" fill="#94A3B8"/>
  <rect x="559" y="9" width="3" height="10" fill="#94A3B8"/>
  <rect x="564" y="7" width="3" height="12" fill="#94A3B8"/>

  <!-- Bottom clue card -->
  <rect x="0" y="252" width="620" height="88" rx="0" fill="#111128"/>
  <rect x="0" y="252" width="620" height="2" fill="rgba(139,92,246,0.4)"/>

  <!-- Progress bar -->
  <text x="20" y="274" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Progress</text>
  <text x="600" y="274" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#A78BFA">3 of 7 clues</text>
  <rect x="20" y="280" width="580" height="6" rx="3" fill="#1e1e40"/>
  <rect x="20" y="280" width="248" height="6" rx="3" fill="url(#progressGrad)"/>

  <!-- Clue card content -->
  <rect x="14" y="296" width="30" height="30" rx="8" fill="rgba(167,139,250,0.15)"/>
  <text x="29" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">🗺️</text>
  <text x="52" y="310" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA">Clue #3 — Find the oldest tree</text>
  <text x="52" y="328" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">Head to Jilani Park, find the tree marked with a carved star.</text>
  <!-- hint button -->
  <rect x="548" y="294" width="60" height="28" rx="14" fill="rgba(167,139,250,0.15)"/>
  <text x="578" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#A78BFA">💡 Hint</text>

  <!-- Compass in top-right -->
  <circle cx="574" cy="80" r="26" fill="rgba(10,14,26,0.8)"/>
  <circle cx="574" cy="80" r="24" fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
  <text x="574" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">N</text>
  <text x="574" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">S</text>
  <text x="556" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">W</text>
  <text x="593" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">E</text>
  <!-- Compass needle -->
  <polygon points="574,60 570,83 574,78 578,83" fill="#f87171"/>
  <polygon points="574,100 570,77 574,82 578,77" fill="#94A3B8"/>
</svg>
