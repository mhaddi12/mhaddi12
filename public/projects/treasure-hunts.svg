  <rect x="0"   y="158" width="620" height="4"  fill="#1e1600"/>
  <rect x="0"   y="224" width="620" height="4"  fill="#1e1600"/>
  <rect x="88"  y="0"   width="5"   height="256" fill="#1e1600"/>
  <rect x="198" y="0"   width="4"   height="256" fill="#1e1600"/>
  <rect x="328" y="0"   width="5"   height="256" fill="#1e1600"/>
  <rect x="456" y="0"   width="4"   height="256" fill="#1e1600"/>
  <rect x="558" y="0"   width="4"   height="256" fill="#1e1600"/>

  <!-- city blocks warm tones -->
  <rect x="93"  y="87"  width="101" height="67" rx="4" fill="#1e1600"/>
  <rect x="202" y="87"  width="122" height="67" rx="4" fill="#1a1200"/>
  <rect x="333" y="87"  width="119" height="67" rx="4" fill="#1e1600"/>
  <rect x="93"  y="162" width="101" height="58" rx="4" fill="#1a1200"/>
  <rect x="202" y="162" width="122" height="58" rx="4" fill="#1e1600"/>
  <rect x="333" y="162" width="119" height="58" rx="4" fill="#1a1200"/>
  <rect x="460" y="87"  width="94"  height="67" rx="4" fill="#1e1600"/>
  <rect x="460" y="162" width="94"  height="58" rx="4" fill="#1a1200"/>

  <!-- park dots (warm olive) -->
  <circle cx="120" cy="112" r="5" fill="#2d2200"/>
  <circle cx="140" cy="106" r="4" fill="#2d2200"/>
  <circle cx="160" cy="118" r="5" fill="#2d2200"/>
  <circle cx="132" cy="128" r="4" fill="#2d2200"/>
  <circle cx="350" cy="108" r="5" fill="#2d2200"/>
  <circle cx="370" cy="100" r="4" fill="#2d2200"/>
  <circle cx="390" cy="114" r="5" fill="#2d2200"/>

  <!-- amber trail -->
  <polyline points="150,130 238,124 356,102 472,172 386,218" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>

  <!-- pin 1 found (amber) -->
  <circle cx="150" cy="130" r="20" fill="rgba(245,158,11,0.15)"/>
  <circle cx="150" cy="124" r="10" fill="#f59e0b"/>
  <circle cx="150" cy="124" r="6"  fill="#fefce8"/>
  <text x="150" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fbbf24">1 ✓</text>

  <!-- pin 2 found -->
  <circle cx="238" cy="118" r="20" fill="rgba(245,158,11,0.15)"/>
  <circle cx="238" cy="112" r="10" fill="#f59e0b"/>
  <circle cx="238" cy="112" r="6"  fill="#fefce8"/>
  <text x="238" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fbbf24">2 ✓</text>

  <!-- pin 3 current (brighter) -->
  <circle cx="356" cy="96"  r="26" fill="rgba(251,191,36,0.18)"/>
  <circle cx="356" cy="96"  r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <circle cx="356" cy="90"  r="12" fill="#fbbf24"/>
  <circle cx="356" cy="90"  r="7"  fill="white"/>
  <text x="356" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fbbf24">3 ← HERE</text>

  <!-- pin 4 locked -->
  <circle cx="472" cy="165" r="10" fill="#2d2200"/>
  <circle cx="472" cy="165" r="6"  fill="#3d3000"/>
  <text x="472" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#6b5900">4 🔒</text>

  <!-- pin 5 locked -->
  <circle cx="386" cy="211" r="10" fill="#2d2200"/>
  <circle cx="386" cy="211" r="6"  fill="#3d3000"/>
  <text x="386" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#6b5900">5 🔒</text>

  <!-- status bar -->
  <rect width="620" height="26" fill="rgba(20,14,0,0.85)"/>
  <text x="16" y="18" font-family="Arial,sans-serif" font-size="11" fill="#d97706">9:41</text>
  <rect x="574" y="7" width="28" height="12" rx="3" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <rect x="602" y="10" width="3" height="6" rx="1" fill="#d97706"/>
  <rect x="576" y="9" width="20" height="8" rx="1.5" fill="#f59e0b"/>

  <!-- bottom clue card -->
  <rect x="0" y="252" width="620" height="88" fill="#1e1500"/>
  <rect x="0" y="252" width="620" height="2"  fill="rgba(245,158,11,0.4)"/>

  <text x="20" y="273"  font-family="Arial,sans-serif" font-size="11" fill="#92400e">Progress</text>
  <text x="600" y="273" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">3 of 7 clues</text>
  <rect x="20" y="278" width="580" height="6" rx="3" fill="#2d2200"/>
  <rect x="20" y="278" width="248" height="6" rx="3" fill="#f59e0b"/>

  <rect x="14" y="294" width="30" height="30" rx="8" fill="rgba(245,158,11,0.12)"/>
  <text x="29" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">🗺️</text>
  <text x="52" y="308" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Clue #3 — Find the oldest tree</text>
  <text x="52" y="326" font-family="Arial,sans-serif" font-size="11" fill="#92400e">Head to Jilani Park — look for the star-carved bark.</text>
  <rect x="548" y="292" width="60" height="26" rx="13" fill="rgba(245,158,11,0.12)"/>
  <text x="578" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#f59e0b">💡 Hint</text>
