  <text x="430" y="281" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">PKR 58,500</text>
  <rect x="536" y="269" width="66" height="18" rx="9" fill="rgba(251,191,36,0.14)"/>
