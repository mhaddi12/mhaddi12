  <text x="598" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ec4899">🔔</text>

  <!-- stories -->
  <rect y="52" width="620" height="76" fill="#1e0018"/>
  <!-- add -->
  <circle cx="42" cy="84" r="26" fill="#280022" stroke="#be185d" stroke-width="1.5" stroke-dasharray="3,2"/>
