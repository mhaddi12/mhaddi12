  <text x="130" y="228" font-family="Arial,sans-serif" font-size="18" fill="#ec4899">💬</text>
  <text x="154" y="228" font-family="Arial,sans-serif" font-size="12" fill="#f9a8d4">47 comments</text>
  <text x="268" y="228" font-family="Arial,sans-serif" font-size="18" fill="#ec4899">↗</text>
  <text x="292" y="228" font-family="Arial,sans-serif" font-size="12" fill="#f9a8d4">Share</text>

  <line x1="0" y1="242" x2="620" y2="242" stroke="#280022" stroke-width="1"/>

  <!-- post 2 partial -->
  <rect y="243" width="620" height="74" fill="#1e0018"/>
  <circle cx="30" cy="263" r="17" fill="#ec4899"/>
  <text x="30" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">FN</text>
  <text x="56" y="259" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#FDF2F8">Fatima Noor</text>
  <text x="56" y="274" font-family="Arial,sans-serif" font-size="10" fill="#9d174d">5 hours ago</text>
  <text x="16" y="300" font-family="Arial,sans-serif" font-size="13" fill="#FDF2F8">Building with Flutter × Firebase = ✨</text>

  <!-- bottom nav -->
  <rect y="317" width="620" height="23" fill="#160012"/>
  <text x="55"  y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ec4899">⌂</text>
  <text x="175" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6d1050">🔍</text>
  <text x="310" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6d1050">＋</text>
  <text x="445" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6d1050">🔔</text>
  <text x="565" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6d1050">👤</text>
