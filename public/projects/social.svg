<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340">
  <rect width="620" height="340" fill="#160012"/>

  <!-- header -->
  <rect width="620" height="52" fill="#1e0018"/>
  <text x="20" y="33" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FDF2F8">Socialize</text>
  <rect x="544" y="13" width="32" height="28" rx="8" fill="rgba(236,72,153,0.12)"/>
  <text x="560" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ec4899">💬</text>
