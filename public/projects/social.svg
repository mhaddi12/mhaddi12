  <text x="16" y="204" font-family="Arial,sans-serif" font-size="13" fill="#FDF2F8">Real-time messaging — buttery smooth.</text>
  <text x="16" y="228" font-family="Arial,sans-serif" font-size="20" fill="#f43f5e">♥</text>
