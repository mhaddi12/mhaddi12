  <text x="42" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#9d174d">Add</text>
  <!-- story 1 -->
  <circle cx="112" cy="84" r="28" fill="#ec4899"/>
  <circle cx="112" cy="84" r="24" fill="#1e0018"/>
  <circle cx="112" cy="84" r="20" fill="#9d174d"/>
  <text x="112" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">AK</text>
  <text x="112" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f9a8d4">Ahmad</text>
  <!-- story 2 -->
  <circle cx="182" cy="84" r="28" fill="#f43f5e"/>
  <circle cx="182" cy="84" r="24" fill="#1e0018"/>
  <circle cx="182" cy="84" r="20" fill="#be123c"/>
  <text x="182" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">SK</text>
  <text x="182" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f9a8d4">Sara</text>
  <!-- story 3 -->
  <circle cx="252" cy="84" r="28" fill="#ec4899"/>
  <circle cx="252" cy="84" r="24" fill="#1e0018"/>
  <circle cx="252" cy="84" r="20" fill="#9d174d"/>
  <text x="252" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">RB</text>
  <text x="252" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f9a8d4">Raza</text>
  <!-- story 4 seen -->
  <circle cx="322" cy="84" r="28" fill="none" stroke="#6d1050" stroke-width="1.5"/>
  <circle cx="322" cy="84" r="24" fill="#1e0018"/>
  <circle cx="322" cy="84" r="20" fill="#7c1059"/>
  <text x="322" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">ZA</text>
  <text x="322" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#9d174d">Zain</text>

  <line x1="0" y1="128" x2="620" y2="128" stroke="#280022" stroke-width="1"/>

  <!-- post 1 -->
  <rect y="129" width="620" height="112" fill="#1e0018"/>
  <circle cx="30" cy="150" r="17" fill="#9d174d"/>
  <text x="30" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">AK</text>
