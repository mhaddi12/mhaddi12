  <text x="192" y="116" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">24.5K</text>

  <rect x="288" y="68" width="98" height="68" rx="10" fill="#181838"/>
  <text x="300" y="90" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Delivered</text>
  <text x="300" y="116" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4ade80">22.1K</text>

  <rect x="396" y="68" width="98" height="68" rx="10" fill="#181838"/>
  <text x="408" y="90" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Opened</text>
