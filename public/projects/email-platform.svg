  <rect x="230" y="200" width="14" height="40" rx="3" fill="url(#sent)"/>
  <rect x="248" y="215" width="14" height="25" rx="3" fill="url(#sent)" opacity="0.9"/>
  <rect x="266" y="195" width="14" height="45" rx="3" fill="url(#open)"/>
  <rect x="284" y="205" width="14" height="35" rx="3" fill="url(#sent)" opacity="0.8"/>
  <rect x="302" y="212" width="14" height="28" rx="3" fill="url(#sent)" opacity="0.7"/>
  <rect x="320" y="198" width="14" height="42" rx="3" fill="url(#open)" opacity="0.9"/>
  <rect x="338" y="218" width="14" height="22" rx="3" fill="url(#sent)" opacity="0.6"/>
  <rect x="356" y="204" width="14" height="36" rx="3" fill="url(#sent)" opacity="0.85"/>
