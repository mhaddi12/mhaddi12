  <text x="516" y="90" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Open Rate</text>
  <text x="516" y="116" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#A78BFA">19.1%</text>

