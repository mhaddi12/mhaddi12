  <text x="30" y="126" font-family="Arial,sans-serif" font-size="13" fill="#64748B">◎ Campaigns</text>
  <text x="30" y="160" font-family="Arial,sans-serif" font-size="13" fill="#64748B">◈ Audience</text>
  <text x="30" y="194" font-family="Arial,sans-serif" font-size="13" fill="#64748B">⊞ Templates</text>
  <text x="30" y="228" font-family="Arial,sans-serif" font-size="13" fill="#64748B">⊙ Domains</text>
