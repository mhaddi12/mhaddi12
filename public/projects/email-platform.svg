  <text x="192" y="282" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Sending Domain</text>
  <text x="192" y="304" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#A78BFA">mail.example.com</text>
  <circle cx="192" cy="318" r="5" fill="#4ade80"/>
  <text x="204" y="322" font-family="Arial,sans-serif" font-size="10" fill="#4ade80">Verified · AWS SES</text>
