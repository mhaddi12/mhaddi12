  <!-- Row 1 -->
  <text x="426" y="196" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Welcome Series</text>
  <rect x="507" y="185" width="48" height="16" rx="8" fill="rgba(74,222,128,0.14)"/>
  <text x="531" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4ade80">Active</text>
  <text x="426" y="210" font-family="Arial,sans-serif" font-size="10" fill="#64748B">8,240 recipients</text>
  <line x1="426" y1="220" x2="596" y2="220" stroke="#1e1e40" stroke-width="1"/>
  <!-- Row 2 -->
  <text x="426" y="240" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Product Launch</text>
