  <text x="426" y="254" font-family="Arial,sans-serif" font-size="10" fill="#64748B">12,500 recipients</text>
  <line x1="426" y1="264" x2="596" y2="264" stroke="#1e1e40" stroke-width="1"/>
  <!-- Row 3 -->
  <text x="426" y="284" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Newsletter #14</text>
  <rect x="506" y="273" width="50" height="16" rx="8" fill="rgba(148,163,184,0.12)"/>
  <text x="531" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Draft</text>
  <text x="426" y="298" font-family="Arial,sans-serif" font-size="10" fill="#64748B">5,100 recipients</text>
  <line x1="426" y1="308" x2="596" y2="308" stroke="#1e1e40" stroke-width="1"/>
  <!-- Row 4 -->
  <text x="426" y="322" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Re-Engagement</text>
  <rect x="506" y="311" width="50" height="16" rx="8" fill="rgba(248,113,113,0.12)"/>
  <text x="531" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f87171">Paused</text>

  <!-- Bottom row -->
