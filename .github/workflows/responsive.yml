name: Portfolio build and responsive mobile checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots-and-traces
          path: test-results/
          if-no-files-found: ignore
